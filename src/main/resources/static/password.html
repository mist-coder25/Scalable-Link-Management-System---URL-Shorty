<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlinkURL – Smart Link Shortener</title>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme_init.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background handled by style.css var */
        }
        .password-card {
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .lock-icon {
            font-size: 3rem;
            color: var(--accent-primary);
            margin-bottom: 1rem;
        }
        h2 { margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="blob-bg"></div>
    
    <div class="password-card glass-panel">
        <div class="lock-icon">
            <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <h2>Link Protected</h2>
        <p>This link requires a password to access. Please enter it below to proceed.</p>
        
        <div class="input-wrapper-pro" style="margin-bottom: 1.5rem;">
            <ion-icon name="key-outline" class="field-icon"></ion-icon>
            <input type="password" id="passwordInput" placeholder="Enter password...">
        </div>
        
        <button id="unlockBtn" class="btn-primary-glow" style="width: 100%;">Unlock & Redirect</button>
        
        <p id="errorMsg" style="color: #ef4444; margin-top: 1rem; display: none;">Invalid password. Please try again.</p>
    </div>

    <script>
        const unlockBtn = document.getElementById('unlockBtn');
        const passwordInput = document.getElementById('passwordInput');
        const errorMsg = document.getElementById('errorMsg');

        // Get shortCode from URL
        const urlParams = new URLSearchParams(window.location.search);
        const shortCode = urlParams.get('c');
        const hasError = urlParams.get('error');

        if (hasError) {
            errorMsg.style.display = 'block';
        }

        unlockBtn.addEventListener('click', () => {
            const password = passwordInput.value;
            if (!password) return;

            // Simply redirect back to the short code with the pw param
            // The backend controller will handle the verification
            window.location.href = `/${shortCode}?pw=${encodeURIComponent(password)}`;
        });

        // Add "Enter" key support
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') unlockBtn.click();
        });
    </script>
</body>
</html>
