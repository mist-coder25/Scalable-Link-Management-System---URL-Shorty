<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlinkURL – Smart Link Shortener</title>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_append.css">
    <script src="theme_init.js"></script>
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            background: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        .sidebar {
            width: 260px;
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .sidebar-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .menu-link:hover, .menu-link.active {
            background: var(--surface-hover);
            color: var(--accent-primary);
        }

        .menu-link ion-icon {
            font-size: 1.25rem;
        }

        .logout-link {
            margin-top: auto;
            color: #ef4444;
        }

        .logout-link:hover {
            background: #fef2f2;
            color: #dc2626;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .theme-toggle-btn {
             background: none;
             border: none;
             cursor: pointer;
             font-size: 1.2rem;
             color: var(--text-primary);
             padding: 0.5rem;
             border-radius: 50%;
             display: flex;
             align-items: center;
             justify-content: center;
             transition: background-color 0.3s ease;
        }
        
        .theme-toggle-btn:hover {
            background-color: var(--surface-hover);
            color: var(--accent-primary);
        }

        .create-btn {
            background: var(--gradient-main);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface-color);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Tables */
        .table-container {
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--surface-hover);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-secondary);
            padding: 0.4rem;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: var(--accent-primary);
            background: var(--surface-hover);
        }

        .disabled-state {
            opacity: 0.5;
        }

        .col-original {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Tab Contents */
        .hidden { display: none !important; }

        /* Modal Overwrite */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
         .modal-content {
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            position: relative;
            border: 1px solid var(--border-color);
        }
        
        .modal-content h2 {
            color: var(--text-primary);
        }

        /* Settings Form */
        .settings-form {
            max-width: 600px;
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="images/logo.svg" alt="BlinkURL" style="height: 28px; margin-right: 8px;">
                <span>BlinkURL</span>
            </div>
            
            <nav class="nav-menu">
                <a href="#" class="menu-link active" data-tab="dashboard">
                    <ion-icon name="grid-outline"></ion-icon>
                    Dashboard
                </a>
                <a href="#" class="menu-link" id="createLinkBtn">
                    <ion-icon name="add-circle-outline"></ion-icon>
                    Create Link
                </a>
                <a href="#" class="menu-link" data-tab="history">
                    <ion-icon name="list-outline"></ion-icon>
                    History
                </a>
                <a href="#" class="menu-link" data-tab="analytics">
                    <ion-icon name="bar-chart-outline"></ion-icon>
                    Analytics
                </a>
                <a href="#" class="menu-link" data-tab="settings">
                    <ion-icon name="settings-outline"></ion-icon>
                    Settings
                </a>
                
                <a href="#" class="menu-link logout-link" onclick="logout()">
                    <ion-icon name="log-out-outline"></ion-icon>
                    Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-content">
                <div class="top-bar">
                    <h1 class="page-title">Dashboard Overview</h1>
                    <div class="user-menu">
                        <button id="themeToggle" class="theme-toggle-btn" title="Toggle Dark Mode" style="margin-right: 1rem;">
                            <ion-icon name="moon-outline"></ion-icon>
                        </button>
                        <button class="create-btn" onclick="document.getElementById('createLinkBtn').click()">
                            <ion-icon name="add-outline"></ion-icon> New Link
                        </button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Links</div>
                        <div class="stat-value" id="totalLinks">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Clicks</div>
                        <div class="stat-value" id="totalClicks">0</div>
                    </div>
                </div>

                <h3>Recent Activity</h3>
                 <div class="chart-container" style="height: 300px; background: var(--surface-color); padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color); margin-top: 1rem;">
                    <canvas id="clickHistoryChart"></canvas>
                </div>
            </div>

            <!-- History Tab -->
            <div id="history" class="tab-content hidden">
                 <div class="top-bar">
                    <h1 class="page-title">Link History</h1>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Original URL</th>
                                <th>Short URL</th>
                                <th>Clicks</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="linksTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Analytics Tab -->
            <div id="analytics" class="tab-content hidden">
                 <div class="top-bar">
                    <h1 class="page-title">Detailed Analytics</h1>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Devices</div>
                        <div style="height: 200px;"><canvas id="deviceChart"></canvas></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Top Countries</div>
                        <div style="height: 200px;"><canvas id="countryChart"></canvas></div>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="settings" class="tab-content hidden">
                <div class="top-bar">
                    <h1 class="page-title">Account Settings</h1>
                </div>
                <div class="settings-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profName" class="form-input" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="profEmail" class="form-input" readonly>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Create Link Modal (Reused from previous code) -->
    <div id="createLinkModal" class="modal hidden">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h2 style="margin:0; color: var(--text-primary);">Create Smart Link</h2>
                <span id="closeCreateModal" style="cursor:pointer; font-size:1.5rem; color: var(--text-secondary);">&times;</span>
            </div>
            
             <div class="modal-tabs" style="display:flex; gap:1rem; margin-bottom:1rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">
                <button class="tab-btn active" data-target="basic-tab" style="background:none; border:none; cursor:pointer; font-weight:600; color:var(--accent-primary);">Basic</button>
                <button class="tab-btn" data-target="advanced-tab" style="background:none; border:none; cursor:pointer; font-weight:600; color:var(--text-secondary);">Advanced</button>
            </div>

            <div id="basic-tab" class="modal-tab-content">
                <div class="form-group">
                    <label>Destination URL</label>
                    <input type="url" id="smartLongUrl" class="form-input" placeholder="https://example.com/very-long-url" required>
                </div>
                <div class="form-group">
                    <label>Custom Alias (Optional)</label>
                    <input type="text" id="smartAlias" class="form-input" placeholder="my-custom-link">
                </div>
            </div>

            <div id="advanced-tab" class="modal-tab-content hidden">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" id="smartExpiry" class="form-input">
                </div>
                <div class="form-group">
                    <label>Max Clicks</label>
                    <input type="number" id="smartMaxClicks" class="form-input" placeholder="No limit">
                </div>
                 <div class="form-group">
                    <label>Password Protection</label>
                    <input type="password" id="smartPassword" class="form-input" placeholder="Optional password">
                </div>
                 <input type="hidden" id="smartGeoRules">
                 <input type="hidden" id="smartDeviceRules">
            </div>

            <div style="margin-top:1.5rem;">
                <button id="submitSmartLink" class="create-btn" style="width:100%; justify-content:center;">Create Link</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('apiKey');
            localStorage.removeItem('apiSecret');
            sessionStorage.removeItem('guestMode');
            window.location.href = '/';
        }
    </script>
</body>
</html>
